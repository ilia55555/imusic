<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>تشخیص نت موسیقی</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    #note { font-size: 48px; margin-top: 20px; color: #2a2a2a; }
    button { font-size: 18px; padding: 10px 20px; }
  </style>
</head>
<body>
  <h1>تشخیص نت از میکروفن</h1>
  <button onclick="start()">شروع</button>
  <p id="note">نت: --</p>

  <script>
    const noteStrings = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

    function getNoteFromFrequency(freq) {
      const A4 = 440;
      const noteNumber = 12 * Math.log2(freq / A4) + 69;
      const rounded = Math.round(noteNumber);
      const note = noteStrings[rounded % 12];
      const octave = Math.floor(rounded / 12) - 1;  // MIDI استاندارد
      return `${note} ${octave}`;
    }

    async function start() {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const audioCtx = new AudioContext();
      const source = audioCtx.createMediaStreamSource(stream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);
      const data = new Float32Array(analyser.fftSize);

      function detect() {
        analyser.getFloatTimeDomainData(data);
        const freq = autoCorrelate(data, audioCtx.sampleRate);
        if (freq !== -1) {
          const note = getNoteFromFrequency(freq);
          document.getElementById("note").innerText = `نت: ${note}`;
        } else {
          document.getElementById("note").innerText = "نت: --";
        }
        requestAnimationFrame(detect);
      }

      detect();
    }

    function autoCorrelate(buffer, sampleRate) {
      // الگوریتم autocorrelation
      let SIZE = buffer.length;
      let rms = 0;
      for (let i = 0; i < SIZE; i++) {
        let val = buffer[i];
        rms += val * val;
      }
      rms = Math.sqrt(rms / SIZE);
      if (rms < 0.01) return -1;

      let r1 = 0, r2 = SIZE - 1, thres = 0.2;
      for (let i = 0; i < SIZE / 2; i++)
        if (Math.abs(buffer[i]) < thres) { r1 = i; break; }
      for (let i = 1; i < SIZE / 2; i++)
        if (Math.abs(buffer[SIZE - i]) < thres) { r2 = SIZE - i; break; }

      buffer = buffer.slice(r1, r2);
      SIZE = buffer.length;

      let c = new Array(SIZE).fill(0);
      for (let i = 0; i < SIZE; i++)
        for (let j = 0; j < SIZE - i; j++)
          c[i] = c[i] + buffer[j] * buffer[j + i];

      let d = 0;
      while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < SIZE; i++) {
        if (c[i] > maxval) {
          maxval = c[i];
          maxpos = i;
        }
      }

      let T0 = maxpos;
      return sampleRate / T0;
    }
  </script>
</body>
</html>
